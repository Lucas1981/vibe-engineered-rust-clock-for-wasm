[package]
name = "clock"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
fontdue = "0.9.4"
tiny-skia = "0.12.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", features = ["clock", "wasmbind"] }
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "ImageData", "Window"] }
